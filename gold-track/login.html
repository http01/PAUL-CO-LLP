<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PAUL & CO LLP — Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: #111111;
            border: 1px solid #3a3a3a;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.12);
        }

        .logo {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 20px;
            border: 2px solid #d4af37;
        }

        h1 {
            text-align: center;
            color: #d4af37;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #444;
            border-radius: 9px;
            background: #080808;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #d4af37;
            color: #050505;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #f0ca4d;
            transform: translateY(-1px);
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #2a1010;
            border: 1px solid #8b3030;
            color: #ff7777;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Logo is in the shared images folder -->
        <img
            src="../images/logo.jpeg"
            alt="PAUL & CO LLP Logo"
            class="logo"
        >

        <h1>PAUL & CO LLP</h1>

        <p class="subtitle">
            Gold Track System — Administrator
        </p>

        <form id="adminLoginForm">

            <label for="username">Company Name</label>

            <input
                type="text"
                id="username"
                placeholder="Enter company name"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Access Admin Dashboard
            </button>

            <div class="error" id="errorMessage">
                Invalid company name or password.
            </div>

        </form>

        <div class="footer">
            PAUL & CO LLP © 2026
        </div>

    </div>

    <script>

        const adminLoginForm =
            document.getElementById("adminLoginForm");

        const errorMessage =
            document.getElementById("errorMessage");


        adminLoginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim()
                        .toLowerCase();

                const password =
                    document
                        .getElementById("password")
                        .value;


                const correctUsername =
                    "paul & co llp";

                const correctPassword =
                    "00gold1";


                if (
                    username === correctUsername &&
                    password === correctPassword
                ) {

                    sessionStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );

                    /*
                     * Admin dashboard is in the
                     * same admin folder.
                     */
                    window.location.href =
                        "dashboard.html";

                } else {

                    errorMessage.style.display =
                        "block";

                }

            }
        );

    </script>

</body>
</html>
