<!-- ==========================================
     Gold Track System
     PAUL & CO LLP
     Client Login
========================================== -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Client Login | PAUL & CO LLP
    </title>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }


        body{

            min-height:100vh;

            background:
            linear-gradient(
                rgba(0,0,0,0.75),
                rgba(0,0,0,0.85)
            ),
            url("images/gold-bg.jpg");

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;

            color:white;

        }


        .login-container{

            width:400px;
            padding:40px;

            background:rgba(20,20,20,0.95);

            border-radius:20px;

            border:1px solid #FFD700;

            box-shadow:
            0 0 30px rgba(255,215,0,0.25);

            text-align:center;

        }


        .logo img{

            width:90px;
            height:90px;

            object-fit:contain;

            margin-bottom:15px;

        }


        .company-name{

            color:#FFD700;

            font-size:28px;

            font-weight:bold;

            margin-bottom:5px;

        }


        .system-name{

            color:#ddd;

            font-size:18px;

            margin-bottom:30px;

        }


        .login-title{

            font-size:25px;

            margin-bottom:25px;

        }


        .input-box{

            text-align:left;

            margin-bottom:20px;

        }


        .input-box label{

            display:block;

            margin-bottom:8px;

            color:#FFD700;

            font-size:15px;

        }


        .input-box input{

            width:100%;

            padding:14px;

            border:none;

            outline:none;

            border-radius:8px;

            background:#222;

            color:white;

            font-size:16px;

            border:1px solid #444;

        }


        .input-box input:focus{

            border-color:#FFD700;

        }


        .password-area{

            position:relative;

        }


        .password-area input{

            padding-right:50px;

        }


        .password-area span{

            position:absolute;

            right:15px;

            top:14px;

            cursor:pointer;

            color:#FFD700;

        }


        .login-button{

            width:100%;

            padding:15px;

            margin-top:15px;

            background:#FFD700;

            color:black;

            border:none;

            border-radius:30px;

            font-size:17px;

            font-weight:bold;

            cursor:pointer;

            transition:.3s;

        }


        .login-button:hover{

            background:white;

        }


        .message{

            margin-top:20px;

            color:#ff5555;

            font-size:14px;

        }


        .back-button{

            display:inline-block;

            margin-top:20px;

            color:#FFD700;

            text-decoration:none;

            font-size:15px;

            transition:.3s;

        }


        .back-button:hover{

            color:white;

        }


        .security-info{

            margin-top:30px;

            padding-top:25px;

            border-top:1px solid #333;

        }


        .security-info h3{

            color:#FFD700;

            margin-bottom:10px;

            font-size:18px;

        }


        .security-info p{

            color:#bbb;

            font-size:13px;

            line-height:1.6;

        }


        .security-items{

            display:flex;

            justify-content:center;

            gap:10px;

            margin-top:20px;

            flex-wrap:wrap;

        }


        .security-box{

            background:#222;

            border:1px solid #333;

            border-radius:8px;

            padding:10px;

            font-size:12px;

            color:#ddd;

        }


        .security-box span{

            display:block;

            margin-top:5px;

        }


        footer{

            margin-top:25px;

            color:#777;

            font-size:12px;

        }


        footer span{

            display:block;

            margin-top:5px;

            color:#FFD700;

        }


        @media(max-width:450px){

            .login-container{

                width:90%;

                padding:30px 25px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <div class="logo">

        <img
        src="images/logo.jpeg"
        alt="PAUL & CO LLP Logo">

    </div>


    <!-- COMPANY -->

    <div class="company-name">

        PAUL & CO LLP

    </div>


    <!-- SYSTEM -->

    <div class="system-name">

        Gold Track System

    </div>


    <!-- LOGIN TITLE -->

    <h2 class="login-title">

        Client Portal Login

    </h2>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- USERNAME -->

        <div class="input-box">

            <label>

                Username

            </label>


            <input
            type="text"
            id="username"
            placeholder="Enter Username"
            autocomplete="username"
            required>

        </div>


        <!-- PASSWORD -->

        <div class="input-box">


            <label>

                Password

            </label>


            <div class="password-area">


                <input
                type="password"
                id="password"
                placeholder="Enter Password"
                autocomplete="current-password"
                required>


                <span
                onclick="showPassword()"
                title="Show/Hide Password">

                    👁

                </span>


            </div>


        </div>


        <!-- LOGIN BUTTON -->

        <button
        type="submit"
        class="login-button">

            Login

        </button>


        <!-- BACK BUTTON -->

        <a
        href="index.html"
        class="back-button">

            ← Back

        </a>


    </form>


    <!-- MESSAGE -->

    <p
    class="message"
    id="message"></p>


    <!-- SECURITY INFORMATION -->

    <div class="security-info">


        <h3>

            Secure Gold Access

        </h3>


        <p>

            This portal allows authorized clients of
            PAUL & CO LLP to securely access their
            gold tracking information.

        </p>


        <div class="security-items">


            <div class="security-box">

                🔒

                <span>

                    Protected Login

                </span>

            </div>


            <div class="security-box">

                📍

                <span>

                    Gold Tracking

                </span>

            </div>


            <div class="security-box">

                🛡️

                <span>

                    Asset Security

                </span>

            </div>


        </div>


    </div>


    <!-- FOOTER -->

    <footer>

        <p>

            © 2026 PAUL & CO LLP

        </p>


        <span>

            Gold Track System

        </span>

    </footer>


</div>


<!-- ==========================================
     JAVASCRIPT
     Login Authentication
========================================== -->

<script>


// ==========================================
// SHOW / HIDE PASSWORD
// ==========================================

function showPassword(){

    let password =
    document.getElementById("password");


    if(password.type === "password"){

        password.type = "text";

    }

    else{

        password.type = "password";

    }

}


// ==========================================
// LOGIN SYSTEM
// ==========================================

document
.getElementById("loginForm")
.addEventListener("submit", function(event){

    event.preventDefault();


    // Get username

    let username =
    document
    .getElementById("username")
    .value
    .trim();


    // Get password

    let password =
    document
    .getElementById("password")
    .value
    .trim();


    // Message box

    let message =
    document
    .getElementById("message");


    // ======================================
    // CLIENT ACCOUNT
    // ======================================

    if(

        username.toLowerCase()
        === "mary thomas"

        &&

        password
        === "gold066"

    ){


        // Save login status

        localStorage.setItem(
            "goldTrackLogin",
            "true"
        );


        // Save username

        localStorage.setItem(
            "username",
            username
        );


        // Success message

        message.style.color =
        "#00ff88";


        // Open dashboard

        setTimeout(function(){

            window.location.href =
            "dashboard.html";

        },1500);


    }

    else{


        // Error message

        message.style.color =
        "red";


        message.innerHTML =
        "Invalid Username or Password";

    }

});

</script>


</body>

</html>
